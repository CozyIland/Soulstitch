<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Soulstitch</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,calc(100vh*16/9));width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;cursor:crosshair;outline:none;touch-action:none;user-select:none;-webkit-user-select:none}
#fs{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:2;width:44px;height:44px;padding:0;border-radius:10px;border:1px solid rgba(255,255,255,.45);background:rgba(0,0,0,.45);color:#fff;font:22px/1 sans-serif;opacity:.75;touch-action:manipulation}
.ov{position:fixed;inset:0;z-index:3;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.88);color:#efe6d0;font:17px/1.45 "Trebuchet MS","Segoe UI",sans-serif;text-align:center}
.ov b{color:#7ff;font-size:22px}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720" tabindex="0"></canvas>
<button id="fs" type="button" aria-label="Vollbild">⛶</button>
<div id="rot" class="ov"><div><b>⟳ Handy quer halten</b><br>Soulstitch wird im Querformat gespielt.</div></div>
<div id="fsHint" class="ov"><div><b>Kein Vollbild möglich</b><br>Dieser Browser erlaubt hier kein Vollbild.<br>Auf dem iPhone geht echtes Vollbild nur,<br>wenn das Spiel als App auf dem Home-Bildschirm liegt.<br><br>Antippen zum Schließen</div></div>
<script>
'use strict';
// ====================================================================
// SOULSTITCH (AT) – Boss Rush im Knochenkolosseum – Prototyp v0.3
// Seitenansicht, gezeichnete Grafik
// ====================================================================
const W=640,H=360,TAU=Math.PI*2,GY=300,AL=30,AR=610,SP=1.6,JV=400,GRAV=900,OUT='#171013';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let S=2;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ---------- Eingabe ----------
const keys=new Set(),pressed=new Set();
const mouse={x:W/2,y:H/2,down:false,click:false};
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.code))e.preventDefault();
  if(!keys.has(e.code))pressed.add(e.code);
  keys.add(e.code);initAudio();
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>{keys.clear();mouse.down=false});
function mpos(e){const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*W;mouse.y=(e.clientY-r.top)/r.height*H}
cv.addEventListener('mousemove',mpos);
cv.addEventListener('mousedown',e=>{mpos(e);mouse.down=true;mouse.click=true;cv.focus();initAudio();e.preventDefault()});
addEventListener('mouseup',()=>mouse.down=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());
// Touch: links ziehen = laufen (nach oben = springen), rechts ziehen = zielen und schießen,
// Knöpfe rechts unten für Sprung und Ausweichen
let joy=null,aimT=null,touchMode=false,jumpTouch=null;
const JB={x:598,y:318,r:28},DB={x:536,y:330,r:22};
function tpos(t){const r=cv.getBoundingClientRect();return{x:(t.clientX-r.left)/r.width*W,y:(t.clientY-r.top)/r.height*H}}
function jumpKey(){const on=jumpTouch!==null||!!(joy&&joy.up);if(on&&!keys.has('Space')){pressed.add('Space');keys.add('Space')}if(!on)keys.delete('Space')}
cv.addEventListener('touchstart',e=>{e.preventDefault();touchMode=true;initAudio();
  for(const t of e.changedTouches){const q=tpos(t);mouse.x=q.x;mouse.y=q.y;mouse.click=true;
    if(state==='fight'){
      if(q.x<W/2){if(!joy)joy={id:t.identifier,ox:q.x,oy:q.y,dx:0,up:false}}
      else if(Math.hypot(q.x-DB.x,q.y-DB.y)<DB.r+8)pressed.add('ShiftLeft');
      else if(Math.hypot(q.x-JB.x,q.y-JB.y)<JB.r+8){jumpTouch=t.identifier;jumpKey()}
      else if(!aimT)aimT={id:t.identifier,x:q.x,y:q.y};
    }}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();
  for(const t of e.changedTouches){const q=tpos(t);
    if(joy&&t.identifier===joy.id){joy.dx=clamp((q.x-joy.ox)/26,-1,1);const dy=(q.y-joy.oy)/26;
      if(!joy.up&&dy<-.7)joy.up=true;else if(joy.up&&dy>-.35)joy.up=false;jumpKey()}
    if(aimT&&t.identifier===aimT.id){aimT.x=q.x;aimT.y=q.y}
  }},{passive:false});
// ---------- Vollbild ----------
const fsBtn=document.getElementById('fs'),fsHint=document.getElementById('fsHint'),root=document.documentElement;
const fsOn=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
async function goFull(){
  if(fsOn())return true;
  const req=root.requestFullscreen||root.webkitRequestFullscreen;if(!req)return false;
  try{await req.call(root,{navigationUI:'hide'})}catch(e){return false}
  try{await screen.orientation.lock('landscape')}catch(e){}
  return true;
}
fsBtn.addEventListener('click',async()=>{
  if(fsOn())(document.exitFullscreen||document.webkitExitFullscreen).call(document);
  else if(!await goFull())fsHint.style.display='flex';
  cv.focus();
});
fsHint.addEventListener('click',()=>fsHint.style.display='none');
const updFs=()=>{const on=fsOn();fsBtn.textContent=on?'✕':'⛶';fsBtn.setAttribute('aria-label',on?'Vollbild beenden':'Vollbild')};
document.addEventListener('fullscreenchange',updFs);document.addEventListener('webkitfullscreenchange',updFs);
let fsTried=false;
const tend=e=>{if(!fsTried){fsTried=true;goFull()}for(const t of e.changedTouches){if(joy&&t.identifier===joy.id)joy=null;if(aimT&&t.identifier===aimT.id)aimT=null;if(t.identifier===jumpTouch)jumpTouch=null}jumpKey()};
cv.addEventListener('touchend',tend);cv.addEventListener('touchcancel',tend);
const K=(...c)=>c.some(k=>keys.has(k)),KP=(...c)=>c.some(k=>pressed.has(k));

// ---------- Ton ----------
let ac=null;
function initAudio(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function beep(f,d=.08,type='square',v=.05,slide=0){
  if(!ac)return;try{
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.linearRampToValueAtTime(0,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

// ---------- Zeichenhelfer ----------
function txt(s,x,y,col='#efe6d0',al='left',sz=13,bold=false,ser=false){
  ctx.font=(bold?'bold ':'')+sz+'px '+(ser?'Georgia,"Times New Roman",serif':'"Trebuchet MS","Segoe UI",Verdana,sans-serif');
  ctx.textAlign=al;ctx.textBaseline='top';ctx.lineJoin='round';
  ctx.strokeStyle='rgba(10,6,8,.85)';ctx.lineWidth=Math.max(2.5,sz*.2);ctx.strokeText(s,x,y);
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function circ(g,x,y,r,fill){g.beginPath();g.arc(x,y,Math.max(0,r),0,TAU);g.fillStyle=fill;g.fill()}
function poly(g,pts,fill,stroke=OUT,lw=1.2){
  g.beginPath();for(let i=0;i<pts.length;i+=2)i?g.lineTo(pts[i],pts[i+1]):g.moveTo(pts[i],pts[i+1]);g.closePath();
  if(fill){g.fillStyle=fill;g.fill()}
  if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.lineJoin='round';g.stroke()}
}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function limb(x1,y1,x2,y2,w,col){
  ctx.lineCap='round';
  for(const[lw,c]of[[w+2,OUT],[w,col]]){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
}

// ---------- Leichenteile ----------
// Jedes Teil gibt einen Bonus. Arme und Beine wirken pro Stück: zwei gleiche verdoppeln den Bonus.
// Bezahlt wird mit Knochen; gekaufte Teile und Knochen bleiben auch nach dem Tod erhalten.
const PARTS={
 kopf:[
  {id:'k0',n:'Namenloser Schädel',d:'Kein Bonus.',p:0,col:'#ddd4ba'},
  {id:'k1',n:'Krähenschädel',d:'Schüsse lenken leicht zum Boss.',p:25,col:'#6a6a88',home:1},
  {id:'k2',n:'Hornschädel',d:'Dash durch den Boss: 3 Schaden.',p:35,col:'#c8a070',horn:1},
  {id:'k3',n:'Doppelschädel',d:'Zwei Schüsse auf einmal.',p:60,col:'#d0a4b6',twin:1}],
 brust:[
  {id:'b0',n:'Dürrer Rumpf',d:'Kein Bonus.',p:0,col:'#b8a888'},
  {id:'b1',n:'Panzerrippen',d:'Nach Treffern 0,8 s länger geschützt.',p:20,col:'#8a909c',inv:.8},
  {id:'b2',n:'Soldatenbrust',d:'+1 Herz, −10 % Tempo.',p:30,col:'#7a8e6a',hp:1,sp:-.1},
  {id:'b3',n:'Kolossrumpf',d:'+2 Herzen, −25 % Tempo.',p:55,col:'#9a5e4c',hp:2,sp:-.25}],
 herz:[
  {id:'h0',n:'Stilles Herz',d:'Kein Bonus.',p:0,col:'#b03838'},
  {id:'h1',n:'Gestärktes Herz',d:'+1 Herz.',p:30,col:'#ff4868',hp:1},
  {id:'h2',n:'Rasendes Herz',d:'Bei 1 Herz: +40 % Feuerrate, Tempo.',p:35,col:'#ff8a30',rage:1},
  {id:'h3',n:'Seelenherz',d:'Jeder 8. Treffer heilt 1 Herz.',p:50,col:'#40e0ff',leech:8}],
 arm:[
  {id:'a0',n:'Knochenarm',d:'Kein Bonus.',p:0,col:'#ddd4ba'},
  {id:'a1',n:'Speerarm',d:'+30 % Reichweite und Schusstempo.',p:15,col:'#c8b48c',bs:.3},
  {id:'a2',n:'Schnitterklaue',d:'+25 % Feuerrate, −20 % Reichweite.',p:15,col:'#c85454',fr:.25,life:-.2},
  {id:'a3',n:'Kanonenarm',d:'+50 % Schaden, −15 % Feuerrate.',p:25,col:'#68728a',dmg:.5,fr:-.15}],
 bein:[
  {id:'l0',n:'Läuferbein',d:'Kein Bonus.',p:0,col:'#a89878'},
  {id:'l1',n:'Stelze',d:'+12 % Lauftempo.',p:15,col:'#c09c58',sp:.12},
  {id:'l2',n:'Sprungsehne',d:'Dash lädt 30 % schneller.',p:15,col:'#70b070',dcd:.3},
  {id:'l3',n:'Froschbein',d:'+12 % Sprunghöhe. Zwei: Doppelsprung.',p:25,col:'#5a9a5a',jmp:.12}]
};
const PART={};for(const t in PARTS)for(const q of PARTS[t]){q.typ=t;PART[q.id]=q}
const SLOTS=[{k:'kopf',n:'Kopf',t:'kopf'},{k:'brust',n:'Brust',t:'brust'},{k:'herz',n:'Herz',t:'herz'},
 {k:'armL',n:'Linker Arm',t:'arm'},{k:'armR',n:'Rechter Arm',t:'arm'},{k:'beinL',n:'Linkes Bein',t:'bein'},{k:'beinR',n:'Rechtes Bein',t:'bein'}];
const maxOwn=q=>q.typ==='arm'||q.typ==='bein'?2:1;
const owned=id=>PART[id].p===0?99:(save.own[id]|0);
// darf Teil q in Platz sl? (genug Stück, die nicht schon in einem anderen Platz stecken)
const canEquip=(sl,q)=>owned(q.id)>SLOTS.filter(s=>s.k!==sl.k&&save.eq[s.k]===q.id).length;
let save={best:0,bones:0,run:1,own:{},eq:{kopf:'k0',brust:'b0',herz:'h0',armL:'a0',armR:'a0',beinL:'l0',beinR:'l0'}};
try{
  const s=JSON.parse(localStorage.getItem('soulstitch2'));
  if(s){save.best=s.best|0;save.bones=Math.max(0,s.bones|0);save.run=clamp(s.run|0,1,30);
    for(const id in PART)if(s.own&&s.own[id])save.own[id]=clamp(s.own[id]|0,0,maxOwn(PART[id]));
    for(const sl of SLOTS){const id=s.eq&&s.eq[sl.k];if(PART[id]&&PART[id].typ===sl.t)save.eq[sl.k]=id}
    for(const sl of SLOTS)if(!canEquip(sl,PART[save.eq[sl.k]]))save.eq[sl.k]=PARTS[sl.t][0].id}
  else{const o=JSON.parse(localStorage.getItem('soulstitch'));if(o)save.best=o.best|0}
}catch(e){}
function persist(){try{localStorage.setItem('soulstitch2',JSON.stringify(save))}catch(e){}}
function stats(){
  const E=SLOTS.map(sl=>PART[save.eq[sl.k]]),sum=f=>E.reduce((a,q)=>a+(q[f]||0),0),has=f=>E.some(q=>q[f]);
  return{hp:1+sum('hp'),speed:150*Math.max(.4,1+sum('sp')),fr:Math.max(.3,1+sum('fr')),dmg:1+sum('dmg'),
    bs:420*(1+sum('bs')),life:.85*(1+sum('life')),dcd:.9*Math.max(.3,1-sum('dcd')),jmp:1+sum('jmp'),
    dbl:save.eq.beinL==='l3'&&save.eq.beinR==='l3',twin:has('twin'),home:has('home'),horn:has('horn'),
    inv:sum('inv'),rage:has('rage'),leech:sum('leech')};
}

// ---------- Spielfigur (Füße bei x,y) ----------
// hinterer Arm/hinteres Bein = links, vorderer (zielender) Arm/vorderes Bein = rechts
const LEG={l0:[12,3.4],l1:[18,2.4],l2:[12,3.4],l3:[13,4.2]},TW={b0:8,b1:10,b2:11,b3:16};
function drawBody(x,y,s,eq,o={}){
  const k=PART[eq.kopf],t=PART[eq.brust],h=PART[eq.herz],aB=PART[eq.armL],aF=PART[eq.armR],lB=PART[eq.beinL],lF=PART[eq.beinR];
  const f=o.f||1,ph=o.run||0,fl=o.flash,C=c=>fl?'#fff':c;
  const leg=Math.max(LEG[lB.id][0],LEG[lF.id][0]),hip=-leg,tw=TW[t.id],th=13,sh=hip-th+3,hy=hip-th-6;
  const lx=o.aim===undefined?.45:Math.cos(o.aim)*f,ly=o.aim===undefined?.9:Math.sin(o.aim);
  ctx.save();ctx.translate(x,y);ctx.scale(s*f,s);ctx.lineJoin='round';
  const arm=(q,x0,y0,dx,dy)=>{
    const w=q.id==='a3'?4.6:2.6,len=q.id==='a1'?12:10,x1=x0+dx*len,y1=y0+dy*len;
    limb(x0,y0,x1,y1,w,C(q.col));
    if(q.id==='a3')limb(x1,y1,x1+dx*3.5,y1+dy*3.5,w+1.6,C('#3a4256'));
    if(q.id==='a1')poly(ctx,[x1+dx*7,y1+dy*7,x1-dy*2.4,y1+dx*2.4,x1+dy*2.4,y1-dx*2.4],C('#efe4c8'),OUT,.8);
    if(q.id==='a2'&&!fl){ctx.strokeStyle='#f6e8d8';ctx.lineWidth=1;ctx.beginPath();
      for(const d of[-.55,0,.55]){const c=Math.cos(d),sn=Math.sin(d);ctx.moveTo(x1,y1);ctx.lineTo(x1+(dx*c-dy*sn)*5,y1+(dx*sn+dy*c)*5)}ctx.stroke()}
  };
  const legD=(q,x0,x1,y1)=>{
    limb(x0,hip,x1,y1,LEG[q.id][1],C(q.col));
    if(q.id==='l3')poly(ctx,[x1-1.5,y1+1.2,x1+5.5,y1+1.2,x1+3,y1-1.5],C(q.col),OUT,.8);
    if(q.id==='l2'&&!fl){ctx.strokeStyle='#d8f0c0';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(x0,hip+2);ctx.lineTo((x0+x1)/2,(hip+y1)/2);ctx.stroke()}
  };
  {const dx=-.25-Math.sin(ph)*.4,dy=.95,m=Math.hypot(dx,dy);arm(aB,-tw/2+1,sh,dx/m,dy/m)}
  if(o.air){legD(lB,-2,-5,hip+leg*.62);legD(lF,2,5,hip+leg*.8)}
  else{const sA=Math.sin(ph)*5,cA=Math.cos(ph);legD(lB,-2,-2+sA,-1-Math.max(0,cA)*3);legD(lF,2,2-sA,-1-Math.max(0,-cA)*3)}
  // Rumpf
  rr(ctx,-tw/2,hip-th,tw,th+2,3);ctx.fillStyle=C(t.col);ctx.fill();
  if(!fl){const g=ctx.createLinearGradient(-tw/2,0,tw/2,0);g.addColorStop(0,'rgba(0,0,0,.3)');g.addColorStop(.6,'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(0,0,0,.1)');ctx.fillStyle=g;ctx.fill()}
  ctx.strokeStyle=OUT;ctx.lineWidth=1.2;ctx.stroke();
  if(!fl){
    ctx.beginPath();for(let i=0;i<tw-3;i+=3){ctx.moveTo(-tw/2+2+i,hip-2.5);ctx.lineTo(-tw/2+3.2+i,hip-4.5)}
    ctx.moveTo(-tw/2+1,hip-th+1.5);ctx.lineTo(-tw/2+3,hip-th+3.5);ctx.moveTo(-tw/2+3,hip-th+1.5);ctx.lineTo(-tw/2+1,hip-th+3.5);
    if(t.id==='b1')for(let i=0;i<3;i++){ctx.moveTo(-tw/2+1,hip-th+5+i*3);ctx.lineTo(tw/2-1,hip-th+5+i*3)}
    ctx.lineWidth=.7;ctx.stroke();
    ctx.shadowColor=h.col;ctx.shadowBlur=6;circ(ctx,1,hip-th+6,1.9,h.col);ctx.shadowBlur=0;
  }
  // Kopf
  const head=(cx,cy,r)=>{ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=C(k.col);ctx.fill();
    if(!fl){const g=ctx.createRadialGradient(cx+r*.3,cy-r*.4,r*.2,cx,cy,r);g.addColorStop(0,'rgba(255,255,255,.3)');g.addColorStop(1,'rgba(0,0,0,.28)');ctx.fillStyle=g;ctx.fill()}
    ctx.strokeStyle=OUT;ctx.lineWidth=1.2;ctx.stroke()};
  const eye=(cx,cy,r)=>{if(fl)return;ctx.shadowColor='#3ff';ctx.shadowBlur=5;circ(ctx,cx,cy,r,'#5ff');ctx.shadowBlur=0};
  const teeth=()=>{if(fl)return;ctx.beginPath();ctx.moveTo(1.5,hy+3.6);ctx.lineTo(5.5,hy+3.6);ctx.moveTo(2.5,hy+2.8);ctx.lineTo(2.5,hy+4.4);ctx.moveTo(4.2,hy+2.8);ctx.lineTo(4.2,hy+4.4);ctx.lineWidth=.6;ctx.strokeStyle=OUT;ctx.stroke()};
  if(k.id==='k3'){head(-4,hy+1.5,5);head(4.5,hy-1,5.2);eye(-2,hy+1,1.3);eye(6.5,hy-1.5,1.4)}
  else if(k.id==='k2'){
    poly(ctx,[-4,hy-4,-9,hy-13,-1,hy-6],C('#efe2c4'),OUT,.9);poly(ctx,[2,hy-6,4,hy-15,6.5,hy-4.5],C('#efe2c4'),OUT,.9);
    head(.5,hy,6.6);eye(1.2,hy-.6,1.4);eye(4.8,hy-.6,1.4);teeth()}
  else if(k.id==='k1'){head(.5,hy,6.6);poly(ctx,[5,hy-1.5,12.5,hy+1.5,5,hy+3.5],C('#e0b040'),OUT,.9);eye(2.6,hy-1.4,1.7)}
  else{head(.5,hy,6.6);eye(1.2,hy-.6,1.4);eye(4.8,hy-.6,1.4);teeth()}
  arm(aF,tw/2-2,sh,lx,ly);
  ctx.restore();
}

// ---------- Boss-Formen (Kasten -50..50) ----------
const CI=(x,y,r)=>`M${x-r},${y}a${r},${r} 0 1,0 ${2*r},0a${r},${r} 0 1,0 ${-2*r},0Z`;
const SHAPES={
 beast:[
  ['b','M-36,-4C-52,-10 -58,-28 -46,-36C-50,-22 -44,-12 -32,-8Z'],
  ['b','M-30,8L-34,50L-22,50L-18,12Z'],['b','M10,10L8,50L20,50L22,10Z'],
  ['a','M-38,-6C-38,-30 14,-32 24,-14L26,12C10,26 -34,22 -38,-6Z'],
  ['a','M-20,10L-24,50L-12,50L-8,14Z'],['a','M20,10L18,50L30,50L32,8Z'],
  ['a','M18,-22C30,-34 50,-22 52,-6C52,4 40,10 30,8C20,6 14,-8 18,-22Z'],
  ['a','M22,-24L18,-44L33,-28Z'],
  ['c',CI(39,-12,4.5)],['w','M34,6L37,13L40,7L43,13L46,6L49,11L50,4Z'],
  ['s','M-22,-20L-20,8M-10,-24L-8,12M2,-24L4,12M-26,-8L-16,-10M-14,-6L-4,-8']],
 skull:[
  ['b','M-18,30L18,30L14,48L-14,48Z'],
  ['a','M-36,-6C-40,-48 40,-48 36,-6C36,10 26,16 22,18L22,32L-22,32L-22,18C-26,16 -36,10 -36,-6Z'],

function drawShape(name,x,y,size,f,col,acc,flash){
  ctx.save();ctx.translate(x,y);ctx.scale(size/50*f,size/50);ctx.lineJoin='round';
  const sh=ctx.createLinearGradient(-20,-50,20,50);sh.addColorStop(0,'rgba(255,255,255,.3)');sh.addColorStop(1,'rgba(0,0,0,.42)');
  for(const s of SHAPES[name])for(const mm of s.m?[1,-1]:[1]){
    ctx.save();ctx.scale(mm,1);
    if(s.t==='s'){if(!flash){ctx.strokeStyle=OUT;ctx.lineWidth=1.8;ctx.stroke(s.p)}}
    else{
      ctx.fillStyle=flash?'#fff':s.t==='c'?acc:s.t==='w'?'#f4ecd8':s.t==='k'?'#140e10':col;
      if(s.t==='c'&&!flash){ctx.shadowColor=acc;ctx.shadowBlur=12}
      ctx.fill(s.p,'evenodd');ctx.shadowBlur=0;
      if(!flash&&(s.t==='a'||s.t==='b')){ctx.fillStyle=sh;ctx.fill(s.p);if(s.t==='b'){ctx.fillStyle='rgba(0,0,0,.3)';ctx.fill(s.p)}}
      ctx.strokeStyle=OUT;ctx.lineWidth=2.6;ctx.stroke(s.p);
    }
    ctx.restore();
  }
  ctx.restore();
}

function startFight(n){

function hurtPlayer(){
  if(phase!=='play'||p.inv>0||p.iv>0)return;
  p.hp--;shake=8;burst(p.x,p.y-17,16,'#ff3838');beep(120,.3,'sawtooth',.08,-80);
  p.hurt=true;
  if(p.hp<=0){phase='dead';deadT=0;p.dieY=p.y;p.inv=0;p.dashT=0;persist();burst(p.x,p.y-17,14,'#ddd4ba',120)}else p.inv=1.3+st.inv;
}
function hurtBoss(dmg){
  if(b.state==='hidden'||b.hp<=0)return false;
  b.hp-=dmg;b.inv=.12;shake=Math.max(shake,3);burst(b.x,b.y,8,b.def[3]);beep(520,.06,'square',.05,200);
  if(st.leech&&++p.hits%st.leech===0&&p.hp<st.hp){p.hp++;burst(p.x,p.y-17,12,'#40e0ff');beep(880,.12,'sine',.06,300)}
  if(b.hp<=.001){
    b.hp=0;b.timers=[];eb=[];hz=[];phase='clear';pt=2.4;burst(b.x,b.y,60,b.def[2],240);burst(b.x,b.y,30,b.def[3],160);shake=12;
    beep(262,.1);setTimeout(()=>beep(330,.1),100);setTimeout(()=>beep(392,.25),200);
    const gain=3+b.n+(p.hurt?0:2);save.bones+=gain;save.best=Math.max(save.best,b.n);persist();
    msg='+'+gain+' Knochen'+(p.hurt?'':' (ohne Treffer +2)');
  }
  return true;
}
function updPlayer(dt){
  let mx=(K('KeyD','ArrowRight')?1:0)-(K('KeyA','ArrowLeft')?1:0);
  const rage=st.rage&&p.hp===1,spd=st.speed*(rage?1.4:1);
  if(joy&&Math.abs(joy.dx)>.25)mx=Math.sign(joy.dx);
  p.inv-=dt;p.iv-=dt;p.cd-=dt;p.dcd-=dt;p.jb-=dt;
  if(KP('Space','KeyW','ArrowUp'))p.jb=.12;
  const hold=K('Space','KeyW','ArrowUp');
  if(p.dashT>0){p.dashT-=dt;p.x+=p.ddx*460*dt;p.vy=0;
    if(st.horn&&!p.horned&&b.state!=='hidden'&&Math.hypot(p.x-b.x,p.y-17-b.y)<b.r+10){p.horned=true;hurtBoss(3);beep(160,.15,'sawtooth',.07)}
    fx.push({x:p.x,y:p.y-17+rnd(-10,10),vx:0,vy:0,life:.22,col:'#55ffff',r:3})}
  else{
    p.x+=mx*spd*dt;if(mx){p.run+=dt*spd*.085;p.mf=mx}else p.run=0;
    if(KP('ShiftLeft','ShiftRight','KeyK','KeyL')&&p.dcd<=0){p.dashT=.22;p.iv=.32;p.dcd=st.dcd;p.horned=false;p.ddx=mx||p.mf;beep(700,.08,'square',.04,400)}
    if(p.jb>0&&(p.gnd||st.dbl&&p.jumps<2)){p.vy=-JV*st.jmp;p.jumps=p.gnd?1:2;p.gnd=false;p.jb=0;beep(p.jumps>1?480:380,.07,'square',.03,260);
      if(p.jumps>1)for(let i=0;i<6;i++)fx.push({x:p.x+rnd(-6,6),y:p.y,vx:rnd(-50,50),vy:rnd(10,60),life:.3,col:'#8fd08f',r:2})}
    p.vy+=GRAV*dt*(p.vy<0&&!hold?2.6:1);p.y+=p.vy*dt;
    if(p.y>=GY){p.y=GY;p.vy=0;if(!p.gnd){p.gnd=true;p.jumps=0;for(let i=0;i<4;i++)fx.push({x:p.x+rnd(-6,6),y:GY,vx:rnd(-40,40),vy:rnd(-30,0),life:.25,col:'#8a6a50',r:2})}}
  }
  p.x=clamp(p.x,AL+8,AR-8);
  // Touch: geschossen wird genau auf die Stelle, die rechts angetippt wird; sonst Blick in Laufrichtung
  const a=touchMode?(aimT?Math.atan2(aimT.y-(p.y-20),aimT.x-p.x):(p.mf<0?Math.PI:0)):mouse.down?Math.atan2(mouse.y-(p.y-20),mouse.x-p.x):Math.atan2(b.y-(p.y-20),b.x-p.x);
  p.aim=a;p.f=Math.cos(a)>=0?1:-1;
  if((mouse.down||(touchMode&&aimT)||K('KeyJ','KeyX'))&&p.cd<=0&&phase==='play'){
    for(const o of st.twin?[-.1,.1]:[0])pb.push({x:p.x+Math.cos(a)*10,y:p.y-21+Math.sin(a)*10,vx:Math.cos(a+o)*st.bs,vy:Math.sin(a+o)*st.bs,life:st.life,dmg:st.dmg,home:st.home});
    p.cd=.45/st.fr/(rage?1.4:1);beep(st.dmg>1?180:660,.05,'square',.03,st.dmg>1?-60:-200);
  }
}
function updBoss(dt){
  const d=b.def,sp=d[5]*SP,gy=GY-b.vr;b.inv-=dt;
  for(const t of b.timers.slice()){t.t-=dt;if(t.t<=0){b.timers.splice(b.timers.indexOf(t),1);t.fn()}}
  const go=(tx,ty,s=sp)=>{const ex=tx-b.x,ey=ty-b.y,m=Math.hypot(ex,ey);if(m>2){b.x+=ex/m*s*dt;b.y+=ey/m*s*dt}};
  if(b.state==='move'){
    b.f=p.x>=b.x?1:-1;
    switch(d[6]){
      case'walk':{const dx=p.x-b.x;if(Math.abs(dx)>b.r+75)b.x+=Math.sign(dx)*sp*dt;break}
      case'right':b.x+=clamp(535-b.x,-sp*dt,sp*dt);break;
      case'center':b.x+=clamp(W/2-b.x,-sp*dt,sp*dt);break;

  if(pileBuy!==i){oSel=i;pileBuy=i;beep(300,.03);return}   // erstes Antippen: nur auswählen

function updPile(){
  if(pCol===0){
    if(KP('KeyW','ArrowUp')){pSel=(pSel+7)%8;syncOpt();beep(300,.03)}
    if(KP('KeyS','ArrowDown')){pSel=(pSel+1)%8;syncOpt();beep(300,.03)}
    if(pSel<7&&KP('KeyD','ArrowRight','Enter','NumpadEnter','Space')){pCol=1;syncOpt();beep(360,.03)}
    else if(pSel===7&&ok())startFight(1);
  }else{
    const n=PARTS[SLOTS[pSel].t].length;
    if(KP('KeyW','ArrowUp')){oSel=(oSel+n-1)%n;pileBuy=-1;beep(300,.03)}
    if(KP('KeyS','ArrowDown')){oSel=(oSel+1)%n;pileBuy=-1;beep(300,.03)}
    if(ok())actOpt(oSel);
    if(KP('KeyA','ArrowLeft','Escape')){pCol=0;syncOpt();beep(250,.03)}
  }
  if(mouse.click){const x=mouse.x,y=mouse.y;
    for(let i=0;i<7;i++)if(inR(ROW(i),x,y)){if(pSel!==i){pSel=i;syncOpt();beep(300,.03)}pCol=1}
    if(pSel<7)for(let i=0;i<PARTS[SLOTS[pSel].t].length;i++)if(inR(CARD(i),x,y)){pCol=1;actOpt(i)}
    if(inR(GOB,x,y))startFight(1);
  }
}

}
function draw(){
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  if(state==='fight')drawFight();else if(state==='pile')drawPile();else if(state==='fall')drawFall();else if(state==='win')drawWin();else drawTitle();
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  resize();update(dt);draw();requestAnimationFrame(loop);
}
// Testhaken für die Konsole: __dbg.fight(n) springt zu Boss n
window.__dbg={fight:n=>startFight(n),bones:n=>{save.bones=n},pile:()=>openPile('Test'),die:()=>{p.inv=0;p.iv=0;p.hp=1;hurtPlayer()},get s(){return{state,phase,bossN,hp:b&&b.hp,eb:eb.length}}};
resize();cv.focus();requestAnimationFrame(loop);
</script>
